<!DOCTYPE html>
<html>
<head>
    <title>Blood Donor Eligibility</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Blood Donor Eligibility</h2>
        <p class="subtitle">Check if you are eligible to donate blood</p>
        <form action="donationservlet" method="post">
            <div class="form-group">
                <label>Age (years)</label>
                <input type="number" name="age" placeholder="Enter your age" required>
            </div>
            <div class="form-group">
                <label>Weight (kg)</label>
                <input type="number" name="weight" placeholder="Enter your weight" required>
            </div>
            <button type="submit">Check Eligibility</button>
        </form>
    </div>
</body>
</html>
